<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>El camino gozoso de buena fortuna — Realidad aumentada</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      .a-enter-vr,
      .a-enter-vr-button,
      .a-enter-ar,
      .a-enter-ar-button {
        display: none !important;
      }

      .instruccion {
        position: fixed;
        z-index: 10;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: min(78vw, 330px);
        box-sizing: border-box;
        padding: 8px 12px;
        border: 1px solid rgba(255, 219, 147, 0.45);
        border-radius: 11px;
        background: rgba(71, 38, 21, 0.86);
        color: #fff7e8;
        text-align: center;
        font-size: 13px;
        line-height: 1.25;
        pointer-events: none;
        backdrop-filter: blur(5px);
      }

      .firma {
        display: block;
        margin-top: 2px;
        color: #ffd890;
        font-size: 10px;
      }
    </style>
  </head>

  <body>
    <div class="instruccion">
      Apuntá la cámara a la tapa del libro
      <span class="firma">CMKA · Biblioteca Tharpa</span>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 8; warmupTolerance: 5;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="gueshela" src="./VGL(1).jpg" crossorigin="anonymous" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Foto a la izquierda de la tapa -->
        <a-plane
          position="-0.78 0.32 0.05"
          width="0.62"
          height="0.62"
          material="color: #fffaf1; opacity: 0.96; transparent: true"
        ></a-plane>
        <a-image
          src="#gueshela"
          position="-0.78 0.32 0.06"
          width="0.57"
          height="0.57"
          animation="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 650; easing: easeOutBack"
        ></a-image>

        <!-- Frase a la derecha de la tapa -->
        <a-plane
          position="0.79 -0.02 0.05"
          width="0.72"
          height="0.9"
          material="color: #7c351f; opacity: 0.92; transparent: true"
        ></a-plane>
        <a-text
          value="El venerable Gueshela nos presenta el sendero completo hacia la iluminación de una manera fácil de comprender y de practicar."
          position="0.79 -0.01 0.06"
          width="0.64"
          align="center"
          anchor="center"
          baseline="center"
          wrap-count="22"
          color="#fff8e9"
          font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
          animation="property: position; from: 0.79 -0.15 0.06; to: 0.79 -0.01 0.06; dur: 700; easing: easeOutCubic"
        ></a-text>
      </a-entity>
    </a-scene>
  </body>
</html>
